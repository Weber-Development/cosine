name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The model test downloads Xenova/all-MiniLM-L6-v2 once and keeps it in the cache.
      - uses: actions/cache@v4
        with:
          path: node_modules/.pnpm/@huggingface+transformers*/node_modules/@huggingface/transformers/.cache
          key: hf-models-all-MiniLM-L6-v2
      - run: pnpm --filter @sweberdev/cosine test
        env:
          COSINE_E2E: "1"
